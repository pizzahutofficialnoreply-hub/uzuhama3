<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>우주하마 방송 예측</title>
    <!-- Favicon & App Icon -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="우주하마 예측" />
    <meta name="description" content="우주하마 방송 예측 통계 및 기록" />
    <meta property="og:title" content="우주하마 방송 예측" />
    <meta property="og:description" content="우주하마 방송 예측 통계 및 기록" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('PWA Service Worker registered with scope:', registration.scope);
              // 서비스 워커 바이트 변경 즉시 확인 및 백그라운드 갱신
              registration.update().catch(() => {});
            })
            .catch((error) => {
              console.warn('PWA Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
