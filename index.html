    <script>
      (function() {
        try {
          var mode = localStorage.getItem('uzuhama_theme_mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preload" as="image" href="/img/hippo-line.png" />
    <script>
      /*
        아이폰 홈 화면 앱(iOS 26 이후) 버그 보정: WebKit 버그 301994
        화면은 874pt 인데 브라우저가 '창 높이'(innerHeight·100vh·dvh·fixed inset-0 기준)를 위쪽 상태 막대 높이(62pt)만큼 뺀 812pt 로 잡음.
        그런데 화면은 맨 위(0)부터 맨 아래(874)까지 다 그려지므로, 화면을 덮는 요소(fixed inset-0: 로딩 화면·안내 뒷배경 등)가
        아래 62pt 를 못 덮고 탭바 중간에서 끊김. 사파리 탭에서는 창 높이가 맞아서 괜찮음.
        → 홈 화면 앱일 때만 (기기 화면 높이 − 창 높이)를 재서 html 에 --pwa-gap 으로 넣고, 화면 덮는 요소를 그만큼 아래로 늘림 (index.css)
      */
      (function () {
        var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (!ios) return;
        function upd() {
          try {
            var d = document.documentElement;
            var sa = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
            var land = window.innerWidth > window.innerHeight;
            var sh = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
            var gap = Math.round(sh - window.innerHeight);
            if (sa && gap > 0 && gap < 160) { d.classList.add('pwa-gap'); d.style.setProperty('--pwa-gap', gap + 'px'); }
            else { d.classList.remove('pwa-gap'); d.style.removeProperty('--pwa-gap'); }
          } catch (e) {}
        }
        upd();
        window.addEventListener('resize', upd);
        window.addEventListener('orientationchange', function () { setTimeout(upd, 300); });
        window.addEventListener('pageshow', upd);
      })();
    </script>

  <body>
    <div id="root"><div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',sans-serif"><img src="/icon-192.png" width="84" height="84" alt="" style="width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35)" /><div class="boot-title" style="margin-top:20px;font-size:17px;font-weight:700;letter-spacing:-0.01em">우주하마 방송 예측</div></div></div>
    <style>#boot-splash{background:#fff}html.dark #boot-splash{background:#000}#boot-splash .boot-title{color:#18181b}html.dark #boot-splash .boot-title{color:#fff}</style>
    <!--
      시작 애니메이션 (우주하마 인트로 영상을 60fps 로 한 장씩 재서 맞춤)
       · 앱 아이콘을 0.35초 보여 준 뒤: 아이콘 가운데에서 파란 바탕(#6383b6)이 일정한 속도로 퍼져 화면을 채움 (0.35초)
       · 동시에 하마(윤곽선만)가 화면 가운데에서 일정한 속도로 커짐 (1.3초, 화면 너비의 66%까지) — 영상: 1.3초 동안 2.6배, 프레임마다 같은 만큼
       · 그다음 얼굴 속으로 빠르게 확대 (0.32초, 24배) — 영상: 이 구간만 확 빨라지며 이빨 위쪽으로 빨려 들어감
       · 화면이 다 파래지면 앱이 다 불러와졌을 때 걷힘
      앱을 켤 때마다 (같은 실행 안의 새로 고침은 빼고) · 설정 > 화면 설정 > 시작 애니메이션 으로 끌 수 있음
    -->
    <div id="intro" aria-hidden="true"><div class="i-card"><img src="/icon-192.png" alt="" /></div><div class="i-flood"></div><img class="i-hippo" src="/img/hippo-line.png" alt="" /></div>
    <style>
      #intro{position:fixed;left:0;right:0;top:0;height:100lvh;z-index:2147483000;overflow:hidden;background:#fff;pointer-events:none}
      html.dark #intro{background:#000}
      #intro.i-done{transition:opacity .28s ease;opacity:0}
      #intro .i-card{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:26px;overflow:hidden}
      #intro .i-card img{width:100%;height:100%;display:block}
      #intro .i-flood{position:absolute;left:50%;top:50%;width:2px;height:2px;margin:-1px 0 0 -1px;border-radius:50%;background:#6383b6;transform:scale(0);will-change:transform}
      #intro .i-hippo{position:absolute;left:50%;top:50%;width:56px;height:45px;margin:-22.5px 0 0 -28px;transform-origin:50% 45%;will-change:transform}
    </style>
    <script>
      (function () {
        var el = document.getElementById('intro');
        var skip = false;
        try {
          skip = sessionStorage.getItem('uzuhama_intro') === '1'
            || localStorage.getItem('uzuhama_intro_off') === '1'
            || navigator.webdriver === true
            || window.matchMedia('(prefers-reduced-motion: reduce)').matches
            || /^\/(admin|selftest)/.test(location.pathname)
            || !el.animate;
          sessionStorage.setItem('uzuhama_intro', '1');
        } catch (e) {}
        if (skip) { el.parentNode.removeChild(el); return; }
        // 홈 화면 앱(아이폰)은 막 켰을 때 창 높이가 짧게 잡혔다가 바뀌어 가운데가 튀므로, 기기 화면 높이로 고정
        var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
        var W = window.innerWidth, H = Math.max(window.innerHeight, document.documentElement.clientHeight || 0);
        if (standalone && window.screen) { H = Math.max(H, W > H ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height)); el.style.height = H + 'px'; }
        var flood = el.querySelector('.i-flood'), hippo = el.querySelector('.i-hippo');
        var R = Math.ceil(Math.sqrt(W * W + H * H) / 2) + 2;
        // 아이콘을 잠깐(0.35초) 그대로 보여 준 뒤, 아이콘 속 하마 크기·자리 그대로에서 출발
        var HOLD = 350;
        hippo.style.opacity = '0';
        // 파란 원: 모양 자르기(clip-path)는 앱을 불러오는 동안 화면 그리기가 밀려 끊겨서, 동그라미를 키우는 방식(transform)으로 → 따로 매끄럽게 돎
        flood.style.width = flood.style.height = (2 * R) + 'px';
        flood.style.margin = (-R) + 'px 0 0 ' + (-R) + 'px';
        flood.animate([{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { duration: 350, delay: HOLD, easing: 'linear', fill: 'forwards' });
        setTimeout(function () { hippo.style.opacity = '1'; }, HOLD);
        var s1 = Math.min(W * 0.66, 360) / 56;
        var A = 1300, B = 320;
        hippo.animate([
          { transform: 'scale(1)', offset: 0, easing: 'linear' },
          { transform: 'scale(' + s1 + ')', offset: A / (A + B), easing: 'cubic-bezier(.35,0,.9,.6)' },
          { transform: 'scale(' + (s1 * 24) + ')', offset: 1 }
        ], { duration: A + B, delay: HOLD, fill: 'forwards' });
        var start = Date.now(), T = HOLD + A + B;
        function done() { el.className = 'i-done'; setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320); }
        function tick() {
          var busy = (window.__uzuLoading || 0) > 0 || document.getElementById('boot-splash');
          if ((!busy && Date.now() - start >= T) || Date.now() - start > 8000) done(); else setTimeout(tick, 50);
        }
        setTimeout(tick, T);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('PWA Service Worker registered with scope:', registration.scope);
              // 서비스 워커 바이트 변경 즉시 확인 및 백그라운드 갱신
              registration.update().catch(() => {});
            })
            .catch((error) => {
              console.warn('PWA Service Worker registration failed:', error);
            });
        });
      }
    </script>
