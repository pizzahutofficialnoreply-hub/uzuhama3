    <script>
      (function() {
        try {
          // 화면 스타일 (기본 / 그림판): 앱이 뜨기 전에 표시를 붙임 (깜빡임 없음)
          if (localStorage.getItem('uzuhama_skin') === 'paint') {
            document.documentElement.classList.add('skin-paint');
          }
          var mode = localStorage.getItem('uzuhama_theme_mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>

    <script>
      /*
        아이폰 홈 화면 앱(iOS 26 이후) 화면 높이 버그 보정 — WebKit 버그 301994
        화면은 874pt 인데 브라우저가 알려 주는 '창 높이'(innerHeight·100vh·dvh)는 위 상태 막대(62pt)만큼 짧은 812pt.
        화면은 맨 아래까지 그려지므로, 창 높이로 크기를 잡은 것(둘러보기 어둡게 칠하기, 카드 확장 높이, 100dvh 등)이 아래 62pt 를 못 덮음.
        → 켤 때(와 화면 크기가 바뀔 때) 실제로 재서 알려 줌:
           window.__vp = { full: 보이는 화면 전체 높이, inner: 창 높이, fixedH: 'fixed; top:0; bottom:0' 상자의 실제 높이, bottomAt: 'fixed; bottom:0' 이 붙는 줄 }
           --app-h  : 보이는 화면 전체 높이 (CSS 에서 100dvh 대신)
           --pwa-gap: 'fixed inset-0' 상자가 화면 끝까지 못 가는 만큼 (0 이면 보정 안 함)
        사파리 탭·안드로이드·PC 는 full = 창 높이라 아무것도 안 바뀜
      */
      (function () {
        var d = document.documentElement;
        var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var p1, p2;
        function probe(css) { var e = document.createElement('div'); e.setAttribute('aria-hidden', 'true'); e.style.cssText = 'position:fixed;left:0;width:1px;visibility:hidden;pointer-events:none;' + css; d.appendChild(e); return e; }
        function upd() {
          try {
            var inner = window.innerHeight, full = inner;
            var sa = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
            if (ios && sa && window.screen) {
              var land = window.innerWidth > inner;
              var sh = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
              if (sh > inner) full = sh; // 홈 화면 앱은 늘 기기 화면 전체를 씀
            }
            if (!p1) { p1 = probe('top:0;bottom:0'); p2 = probe('bottom:0;height:1px'); }
            var fixedH = Math.round(p1.getBoundingClientRect().height);
            var bottomAt = Math.round(p2.getBoundingClientRect().bottom);
            window.__vp = { full: full, inner: inner, fixedH: fixedH, bottomAt: bottomAt };
            d.style.setProperty('--app-h', full + 'px');
            var gap = Math.max(0, full - fixedH);
            if (gap > 0) { d.classList.add('pwa-gap'); d.style.setProperty('--pwa-gap', gap + 'px'); }
            else { d.classList.remove('pwa-gap'); d.style.removeProperty('--pwa-gap'); }
          } catch (e) {}
        }
        upd();
        // 막 켰을 때 화면이 펴지는 동안 값이 바뀌는데 크기 바뀜 알림이 그보다 먼저 와서 낡은 값이 남을 수 있음 → 처음 4초는 자주 다시 잼
        var n = 0, iv = setInterval(function () { upd(); if (++n >= 16) clearInterval(iv); }, 250);
        window.addEventListener('resize', function () { upd(); setTimeout(upd, 120); setTimeout(upd, 400); });
        window.addEventListener('orientationchange', function () { setTimeout(upd, 300); });
        window.addEventListener('pageshow', upd);
      })();
    </script>

  <body>
    <!-- 그림판 스타일용: 선을 마우스로 그은 것처럼 살짝 흔듦 (index.css 의 html.skin-paint) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="paint-wob"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter></svg>
    <div id="root"><div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',sans-serif"><img src="/icon-192.png" width="84" height="84" alt="" style="width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35)" /><div class="boot-title" style="margin-top:20px;font-size:17px;font-weight:700;letter-spacing:-0.01em">우주하마 방송 예측</div></div></div>
    <style>#boot-splash{background:#fff}html.dark #boot-splash{background:#000}#boot-splash .boot-title{color:#18181b}html.dark #boot-splash .boot-title{color:#fff}</style>
    <!--
      시작 애니메이션 (우주하마 인트로 영상을 60fps 로 한 장씩 재서 맞춤)
       · 앱 아이콘을 0.35초 보여 준 뒤: 아이콘 가운데에서 파란 바탕(#6383b6)이 일정한 속도로 퍼져 화면을 채움 (0.35초)
       · 동시에 하마(윤곽선만)가 화면 가운데에서 일정한 속도로 커짐 (1.3초, 화면 너비의 66%까지) — 영상: 1.3초 동안 2.6배, 프레임마다 같은 만큼
       · 그다음 얼굴 속으로 빠르게 확대 (0.32초, 24배) — 영상: 이 구간만 확 빨라지며 이빨 위쪽으로 빨려 들어감
       · 화면이 다 파래지면 앱이 다 불러와졌을 때 걷힘
      앱을 켤 때마다 (같은 실행 안의 새로 고침은 빼고) · 설정 > 화면 설정 > 시작 애니메이션 으로 끌 수 있음
    -->
    <div id="intro" aria-hidden="true"><div class="i-card"><img src="/icon-192.png" alt="" /></div><div class="i-flood"></div><div class="i-hippo"><img class="i-fill" src="/img/hippo.png" alt="" /><img src="/img/hippo-line.png" alt="" /></div></div>
    <style>
      #intro{position:fixed;left:0;right:0;top:0;height:var(--app-h, 100lvh);z-index:2147483000;background:#fff;pointer-events:none}
      /* 화면 높이를 잘못 알려 줘도 아래가 비지 않게 바탕을 아래로 넉넉히 더 칠함 (가운데 자리는 그대로) */
      /* 시작 화면이 도는 동안엔 아래 탭바를 아예 숨김 (화면이 펴지는 순간 아래로 비치지 않게) */
      html.intro-on #floating-bottom-dock{visibility:hidden!important}
      #intro::after{content:'';position:absolute;left:0;right:0;top:100%;height:400px;background:inherit}
      html.dark #intro{background:#000}
      #intro.i-done{transition:opacity .28s ease;opacity:0}
      #intro .i-card{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:26px;overflow:hidden}
      #intro .i-card img{width:100%;height:100%;display:block}
      #intro .i-flood{position:absolute;z-index:1;left:50%;top:50%;width:2px;height:2px;margin:-1px 0 0 -1px;border-radius:50%;background:#6383b6;transform:scale(0);will-change:transform}
      #intro .i-hippo{position:absolute;left:50%;top:50%;width:56px;height:45px;margin:-22.5px 0 0 -28px;transform-origin:50% 45%;will-change:transform;z-index:2}
      #intro .i-hippo img{position:absolute;inset:0;width:100%;height:100%}
    </style>
    <script>
      (function () {
        var el = document.getElementById('intro');
        var skip = false;
        try {
          skip = sessionStorage.getItem('uzuhama_intro') === '1'
            || localStorage.getItem('uzuhama_intro_off') === '1'
            || navigator.webdriver === true
            || window.matchMedia('(prefers-reduced-motion: reduce)').matches
            || /^\/(admin|selftest)/.test(location.pathname)
            || !el.animate;
          sessionStorage.setItem('uzuhama_intro', '1');
        } catch (e) {}
        if (skip) { el.parentNode.removeChild(el); return; }
        document.documentElement.classList.add('intro-on');
        var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        // 높이: 아이폰 홈 화면 앱은 창 높이가 짧게 잡히는 버그가 있어 head 의 --pwa-gap 만큼 아래로 늘림 (CSS) → 늘 기기 화면 전체
        var W = window.innerWidth, H = Math.max(window.innerHeight, document.documentElement.clientHeight || 0);
        var flood = el.querySelector('.i-flood'), hippo = el.querySelector('.i-hippo');
        // 원 크기: 창 높이가 나중에 바뀌어도 모자라지 않게 기기 화면 크기 기준으로 넉넉히
        var SW = Math.max(W, window.screen ? screen.width : 0, window.screen ? screen.height : 0);
        var R = Math.ceil(Math.sqrt(SW * SW + SW * SW) / 2) + 4;
        // 아이콘을 잠깐(0.35초) 그대로 보여 준 뒤, 아이콘 속 하마 크기·자리 그대로에서 출발
        var card = el.querySelector('.i-card'), fill = el.querySelector('.i-fill');
        hippo.style.opacity = '0';
        flood.style.width = flood.style.height = (2 * R) + 'px';
        flood.style.margin = (-R) + 'px 0 0 ' + (-R) + 'px';
        var s0 = 1.45, s1 = Math.min(W * 0.66, 360) / 56;
        // P: 아이콘에서 하마가 튀어나옴 / A: 일정한 속도로 커짐 (원본 인트로) / B: 얼굴 속으로 빨려 들어감
        var P = 450, A = 1300, B = 320, FLOOD_AT = 330;
        var t0 = Date.now(), began = false;
        function done() { document.documentElement.classList.remove('intro-on'); el.className = 'i-done'; setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320); }
        function tick(start) {
          var busy = (window.__uzuLoading || 0) > 0 || document.getElementById('boot-splash');
          if ((!busy && Date.now() - start >= P + A + B) || Date.now() - t0 > 9000) done(); else setTimeout(function () { tick(start); }, 50);
        }
        function begin() {
          if (began) return; began = true;
          // 1) 하마(색 채운 그림)가 아이콘 속 그 자리에서 살짝 튀어 오르며 나오고, 아이콘 판은 작아지며 사라짐
          hippo.style.opacity = '1';
          hippo.animate([
            { transform: 'scale(1)', offset: 0, easing: 'cubic-bezier(.34,1.5,.64,1)' },
            { transform: 'scale(' + s0 + ')', offset: P / (P + A + B), easing: 'linear' },
            { transform: 'scale(' + s1 + ')', offset: (P + A) / (P + A + B), easing: 'cubic-bezier(.35,0,.9,.6)' },
            { transform: 'scale(' + (s1 * 24) + ')', offset: 1 }
          ], { duration: P + A + B, fill: 'forwards' });
          card.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.82)', opacity: 0 }], { duration: 380, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
          // 2) 그다음 하마 뒤에서 파란 바탕이 일정한 속도로 퍼짐 (동그라미를 키우는 방식이라 끊기지 않음) → 하마는 윤곽선만 남음
          var fa = flood.animate([{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { duration: 350, delay: FLOOD_AT, easing: 'linear', fill: 'forwards' });
          if (fa && fa.finished) fa.finished.then(function () { el.style.background = '#6383b6'; }).catch(function () {});
          fill.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, delay: FLOOD_AT + 40, fill: 'forwards' });
          var start = Date.now();
          setTimeout(function () { tick(start); }, P + A + B);
        }
        // 아이콘을 0.25초 보여 준 뒤 시작. 홈 화면 앱은 막 켰을 때 아래가 잠깐 덜 그려져 있어 펴질 때까지 조금 더 기다림 (최대 0.6초)
        var HOLD = 250, MAXWAIT = 600;
        var waitFull = ios && ((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true);
        var grown = !waitFull;
        function tryBegin() { if (grown && Date.now() - t0 >= HOLD) begin(); }
        if (waitFull) {
          var h0 = window.innerHeight;
          var onRs = function () { if (window.innerHeight !== h0) { grown = true; setTimeout(tryBegin, 60); } };
          window.addEventListener('resize', onRs);
          if (window.visualViewport) visualViewport.addEventListener('resize', onRs);
          setTimeout(function () { grown = true; tryBegin(); }, MAXWAIT);
        }
        setTimeout(tryBegin, HOLD);
      })();
    </script>

              registration.update().catch(() => {});
            })
            .catch((error) => {
              console.warn('PWA Service Worker registration failed:', error);
            });
        });
      }
    </script>
