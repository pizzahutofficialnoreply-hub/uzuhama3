name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://uzuhama.vercel.app/api/videos/search-index
          echo RUN1; curl -s --max-time 70 "$U?ai=run"; echo
          echo RUN2; curl -s --max-time 70 "$U?ai=run"; echo
          echo STATUS; curl -s "$U?ai=status"; echo
          echo PN; curl -s "https://uzuhama.vercel.app/api/patch-notes?announce=$(date +%s)" | head -c 200; echo
