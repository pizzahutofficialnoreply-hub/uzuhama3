name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://uzuhama.vercel.app/api/videos/search-index
          echo BEFORE; curl -s "$U?ai=status" | head -c 300; echo
          echo TICK; curl -s "https://uzuhama.vercel.app/api/notifications/tick?src=probe" | head -c 200; echo
          sleep 90
          echo AFTER; curl -s "$U?ai=status" | head -c 300; echo
