name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS --max-time 295 "https://uzuhama.vercel.app/api/videos/search-index?ai=check" > r.json
          head -c 200 r.json; echo
          jq -c '.stats | {autoFilled, dateFixed, dateFixedSample, c: (.cleanup|{actions:[.actions[]?.msg], notes:[.notes[]? | select(test("생방이 없고|못 정했"))]})}' r.json
