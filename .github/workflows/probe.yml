name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS --max-time 295 "https://uzuhama.vercel.app/api/videos/search-index?ai=check" > r.json
          jq '{ok, skipped, stats: (.stats|del(.dateFixedSample))}' r.json || cat r.json
