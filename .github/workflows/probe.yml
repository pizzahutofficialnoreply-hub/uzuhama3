name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://uzuhama.vercel.app/api/videos/search-index?ai=diag"
          sleep 20
          for q in "v=text" "v=plain" "v=mime" "v=low" "v=plain&model=gemini-flash-latest" "v=plain&model=gemini-flash-lite-latest" "v=plain&id=maumXxWfOIc"; do echo "D $q"; curl -s --max-time 130 "$U&$q"; echo; done
