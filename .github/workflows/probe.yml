name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=AIzaSyD33dUT30Gn5Vr2OKA_X3sI1HAddVsMZoM; T=""; : > all.json
          for i in $(seq 1 30); do
            R=$(curl -sS "https://firestore.googleapis.com/v1/projects/uzuhama/databases/(default)/documents/logs?key=$K&pageSize=300&mask.fieldPaths=date&mask.fieldPaths=time&mask.fieldPaths=endTime&mask.fieldPaths=durationHours&mask.fieldPaths=isAbsence${T:+&pageToken=$T}")
            echo "$R" | jq -c '.documents[]?' >> all.json
            T=$(echo "$R" | jq -r '.nextPageToken // empty'); [ -z "$T" ] && break
          done
          echo "total $(wc -l < all.json)"
          echo "absence $(jq -s '[.[]|select(.fields.isAbsence.booleanValue==true)]|length' all.json)"
          echo "no time $(jq -s '[.[]|select(.fields.isAbsence.booleanValue!=true)|select((.fields.time.stringValue // "")=="")]|length' all.json)"
          echo "no end $(jq -s '[.[]|select(.fields.isAbsence.booleanValue!=true)|select((.fields.endTime.stringValue // "")=="")]|length' all.json)"
          echo "no time by year:"; jq -s -r '[.[]|select(.fields.isAbsence.booleanValue!=true)|select((.fields.time.stringValue // "")=="")|.fields.date.stringValue[0:4]]|group_by(.)|map("\(.[0]) \(length)")|.[]' all.json
          echo "with time by year:"; jq -s -r '[.[]|select(.fields.isAbsence.booleanValue!=true)|select((.fields.time.stringValue // "")!="")|.fields.date.stringValue[0:4]]|group_by(.)|map("\(.[0]) \(length)")|.[]' all.json
