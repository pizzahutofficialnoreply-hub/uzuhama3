name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://firestore.googleapis.com/v1/projects/uzuhama/databases/(default)/documents/config/system?key=AIzaSyD33dUT30Gn5Vr2OKA_X3sI1HAddVsMZoM&mask.fieldPaths=noticeList&mask.fieldPaths=autoPatchNotice&mask.fieldPaths=appVersion" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['fields']
          print('AP',json.dumps(d.get('autoPatchNotice'),ensure_ascii=False)[:300])
          print('AV',d.get('appVersion'))
          for n in d.get('noticeList',{}).get('arrayValue',{}).get('values',[]):
            f=n['mapValue']['fields']; print('N',f.get('id',{}).get('stringValue'),f.get('title',{}).get('stringValue'),f.get('type',{}).get('stringValue'),f.get('active'),'|',f.get('content',{}).get('stringValue','')[:200].replace(chr(10),' / '),'|',json.dumps(f.get('links'),ensure_ascii=False)[:200])
          "
