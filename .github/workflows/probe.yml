name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          id=$(curl -sS -X POST -H 'Content-Type: application/json' -d '{"deep":false,"vid":"claude-test"}' "https://uzuhama.vercel.app/api/health?selftest=request" | tee /dev/stderr | jq -r .id)
          for i in $(seq 1 50); do sleep 20; s=$(curl -sS "https://uzuhama.vercel.app/api/health?selftest=status&id=$id"); echo "$(date -u +%H:%M:%S) $(echo $s | jq -c '{status,stage,n:(.results|length),fail:([.results[]|select(.ok==false)]|length)}')"; st=$(echo $s | jq -r .status); [ "$st" = done ] || [ "$st" = error ] || [ "$st" = cancel ] && break; done
          curl -sS "https://uzuhama.vercel.app/api/health?selftest=status&id=$id" | jq -c '.results[] | select(.ok==false or .warn==true) | {group,name,err}'
