name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for V in HS7jvcdsyF8 F4aNNqUT784; do
            echo "== $V"
            curl -sS -A "Mozilla/5.0" -H "Accept-Language: ko" "https://www.youtube.com/watch?v=$V" > p.html
            grep -o '"startTimestamp":"[^"]*"\|"endTimestamp":"[^"]*"\|"publishDate":"[^"]*"\|"uploadDate":"[^"]*"\|itemprop="startDate" content="[^"]*"\|itemprop="endDate" content="[^"]*"\|"lengthSeconds":"[^"]*"\|"isLiveContent":[a-z]*' p.html | sort -u
            grep -o '<title>[^<]*' p.html
          done
