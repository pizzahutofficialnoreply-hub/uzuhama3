name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://uzuhama.vercel.app/api/videos/search-index
          sleep 20
          echo RUN1; curl -s -w ' [%{time_total}s]' --max-time 300 "$U?ai=run&kind=short"; echo
          echo RUN2; curl -s -w ' [%{time_total}s]' --max-time 300 "$U?ai=run&kind=video"; echo
          echo STATUS; curl -s "$U?ai=status"; echo
          echo SEARCH; curl -s "$U?ai=search&q=%EA%B3%B5%ED%8F%AC"; echo
