name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S='import json,sys;d=json.load(sys.stdin);print("K",d.get("total"),d.get("kinds"),d.get("lastRunAt"),d.get("usedSec"),d.get("calls"),d.get("partial"),str(d.get("lastError"))[:120])'
          U=https://uzuhama.vercel.app/api/videos/search-index?ai=status
          curl -s $U | python3 -c "$S"
          curl -s "https://uzuhama.vercel.app/api/notifications/tick?src=probe" | head -c 100; echo
          sleep 90; curl -s $U | python3 -c "$S"
          curl -s "https://uzuhama.vercel.app/api/notifications/tick?src=probe" | head -c 100; echo
          sleep 180; curl -s $U | python3 -c "$S"
