name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=AIzaSyD33dUT30Gn5Vr2OKA_X3sI1HAddVsMZoM
          for M in 2026-08 2020-08 2023-03; do
          curl -sS "https://firestore.googleapis.com/v1/projects/uzuhama/databases/(default)/documents/logs_by_month/$M?key=$K" > m.json
          echo "== $M"; jq -c '.fields.items.mapValue.fields | to_entries[] | .value.mapValue.fields | {d:.date.stringValue,t:.time.stringValue,e:.endTime.stringValue,h:(.durationHours.doubleValue // .durationHours.integerValue),p:._patch.booleanValue}' m.json | sort | head -12
          done
