name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          node .github/probe/pw.mjs
