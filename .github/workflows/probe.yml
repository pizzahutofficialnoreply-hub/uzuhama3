name: probe (임시)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5 6 7 8; do
            R=$(curl -s --max-time 70 "https://uzuhama.vercel.app/api/videos/shorts?kind=related&batch=150&t=$i")
            echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); print('linked',len(d['map']),'total',d['total'],'checked',d['checked'],'remaining',d['remaining'])"
            echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d['remaining']>0 else 3)" || break
            sleep 3
          done
