name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://uzuhama.vercel.app/api/videos/search-index
          echo BEFORE; curl -s "$U?ai=status" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('lastRunAt'),d.get('usedSec'),d.get('partial'),d.get('lastError'))"
          echo TICK; curl -s -w ' [%{time_total}s]' "https://uzuhama.vercel.app/api/notifications/tick?src=probe" | head -c 120; echo
          sleep 170
          echo AFTER; curl -s "$U?ai=status" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('lastRunAt'),d.get('usedSec'),d.get('partial'),d.get('lastError'))"
