name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://uzuhama.vercel.app/api/admin/mutate
          for a in mfaStatus mfaBeginSetup mfaVerify weeklyReports; do echo "A $a $(curl -s -o /tmp/o -w '%{http_code}' -X POST $U -H 'Content-Type: application/json' -d "{\"action\":\"$a\"}") $(head -c 80 /tmp/o)"; done
          echo "B $(curl -s -o /tmp/o -w '%{http_code}' -X POST $U -H 'Authorization: Bearer x' -H 'Content-Type: application/json' -d '{"action":"mfaBeginSetup"}') $(head -c 80 /tmp/o)"
          echo "H $(curl -sI https://uzuhama.vercel.app/admin | grep -i 'x-robots\|cache-control' | tr -d '\r' | tr '\n' ' ')"
