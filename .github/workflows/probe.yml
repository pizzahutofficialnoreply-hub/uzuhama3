name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://uzuhama.vercel.app/api/videos/search-index
          q() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$1"; }
          for w in "갑툭튀" "귀신 나오는 장면" "비명"; do echo "S $w $(curl -s "$U?ai=search&q=$(q "$w")&t=$RANDOM" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('expanded'),[(r['title'][:20],r['score'],[(s['t'],s.get('vague',False),s['d'][:40]) for s in r['scenes'][:2]]) for r in d['results'][:3]])")"; done
          echo "V $(curl -s "$U?ai=video&id=p59s4mXoBrs" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('found'),d.get('status'),d.get('seg'),len(d.get('scenes',[])),[g.get('name') for g in d.get('games',[])],str(d.get('summary'))[:80])")"
          echo "N $(curl -s "$U?ai=video&id=dQw4w9WgXcQ")"
