name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=AIzaSyD33dUT30Gn5Vr2OKA_X3sI1HAddVsMZoM
          curl -sS "https://firestore.googleapis.com/v1/projects/uzuhama/databases/(default)/documents/logs_by_month/2020-08?key=$K" | head -c 400; echo
          curl -sS "https://firestore.googleapis.com/v1/projects/uzuhama/databases/(default)/documents/logs_by_month?key=$K&pageSize=300" | jq -c '[.documents[] | {n:(.name|split("/")|last), sz:(tostring|length)}] | (map(.sz)|add) as $t | {count:length, totalBytes:$t, big: (sort_by(-.sz)|.[0:5])}'
