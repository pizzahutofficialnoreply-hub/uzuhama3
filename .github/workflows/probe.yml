name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS --max-time 295 "https://uzuhama.vercel.app/api/videos/search-index?ai=check" > r.json
          head -c 300 r.json; echo
          jq -c '.stats | {autoFilled, dateFixed, dateFixedSample, c: (.cleanup|{freeLives,freeNear,noLive,addedLives,addLiveError,actions:[.actions[]?.msg]})}' r.json
