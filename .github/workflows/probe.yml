name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS --max-time 295 "https://uzuhama.vercel.app/api/videos/search-index?ai=check" | jq -c '{ok, error, ms, s: (.stats|{ytInfo, timeChecked, autoFilled, fillError})}'
          K=AIzaSyD33dUT30Gn5Vr2OKA_X3sI1HAddVsMZoM
          curl -sS "https://firestore.googleapis.com/v1/projects/uzuhama/databases/(default)/documents/logs_by_month/2026-03?key=$K" | jq -c '.fields.items.mapValue.fields | to_entries[] | .value.mapValue.fields | select(.date.stringValue=="2026-03-02") | {d:.date.stringValue,t:.time.stringValue,e:.endTime.stringValue,h:.durationHours}'
