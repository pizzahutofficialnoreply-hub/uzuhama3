name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://uzuhama.vercel.app/api/videos/search-index
          q() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$1"; }
          for w in "갑툭튀" "비명 지르는 장면"; do echo "S $w"; curl -s -w ' [%{time_total}s]' --max-time 200 "$U?ai=verify&q=$(q "$w")&r=$RANDOM" | head -c 1500; echo; done
