name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=AIzaSyD33dUT30Gn5Vr2OKA_X3sI1HAddVsMZoM
          curl -sS "https://firestore.googleapis.com/v1/projects/uzuhama/databases/(default)/documents/logs_by_month/2024-06?key=$K" | jq -c '.fields.items.mapValue.fields | to_entries[] | select(.key|test("archive_401")) | {k:.key, d:.value.mapValue.fields.date.stringValue, nd:.value.mapValue.fields._date.stringValue, t:.value.mapValue.fields.time.stringValue}'
