name: probe4
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ci
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund 2>&1 | tail -5
      - name: pw
        timeout-minutes: 6
        run: npx playwright install --with-deps webkit 2>&1 | tail -5
      - name: script
        timeout-minutes: 2
        run: node scripts/cloud-selftest.mjs; echo "script exit $?"
