name: probe4
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          id=$(curl -sS -X POST -H 'Content-Type: application/json' -d '{"deep":false,"vid":"claude-test2"}' "https://uzuhama.vercel.app/api/health?selftest=request" | jq -r .id); echo "req $id"
          curl -sS -X POST -H 'Content-Type: application/json' -d "{\"run\":\"$GITHUB_RUN_ID\"}" "https://uzuhama.vercel.app/api/health?selftest=claim"; echo
          curl -sS -X POST -H 'Content-Type: application/json' -d '{"run":"43048387784"}' "https://uzuhama.vercel.app/api/health?selftest=claim"; echo
          curl -sS -X POST "https://uzuhama.vercel.app/api/health?selftest=cancel&id=$id"; echo
