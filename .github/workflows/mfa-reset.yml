name: mfa-reset (one-off)
on:
  push:
    paths: ['.github/workflows/mfa-reset.yml']
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - run: npm i firebase-admin@14 --no-save --silent
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UZUHAMA }}
        run: |
          node -e "
          const a=require('firebase-admin');
          const sa=JSON.parse(process.env.SA);
          a.initializeApp({credential:a.credential.cert(sa)});
          const r=a.firestore().collection('admin_security').doc('main');
          r.set({totp:null,enabledAt:null,recovery:[],pending:null,fails:0,lockUntil:0,resetAt:new Date().toISOString(),resetBy:'owner request'},{merge:true})
           .then(()=>r.get()).then(s=>{const d=s.data()||{};console.log('RESET OK enabled=',!!d.enabledAt,'fails=',d.fails,'lock=',d.lockUntil);process.exit(0)})
           .catch(e=>{console.log('RESET FAIL',e.message);process.exit(1)});
          "
