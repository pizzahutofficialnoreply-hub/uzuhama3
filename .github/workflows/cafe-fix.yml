name: cafe-fix (임시 · 카페 기준 기록 맞추기)
on:
  workflow_dispatch:
    inputs:
      dry: { description: '1이면 보기만', default: '1' }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund >/dev/null 2>&1
      - run: npx tsx scripts/_cafe-fix.ts
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UZUHAMA }}
          DRY: ${{ inputs.dry }}
