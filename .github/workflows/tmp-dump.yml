name: tmp dump (일회용)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save firebase-admin@13 >/dev/null 2>&1
      - run: node ops/tmp/dump.mjs
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_UZUHAMA }}" }
      - name: encrypt & push to tmp branch
        run: |
          tar czf dump.tgz out
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -in dump.tgz -out dump.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey ops/tmp/pub.pem -in k.txt -out k.enc
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan tmp-dump
          git rm -rfq --cached .
          git add -f dump.enc k.enc
          git commit -qm dump
          git push -f origin tmp-dump
