name: tmp job (일회용 · 분석)
on:
  workflow_dispatch:
    inputs:
      script: { description: '돌릴 스크립트', required: true, default: 'ops/tmp/apply.ts' }
      dry: { description: '시험만 (쓰기 안 함)', type: boolean, default: true }
permissions:
  contents: write
jobs:
  j:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 지난 임시 브랜치 지우기
        run: git push origin --delete tmp-dump || true
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save firebase-admin@13 tsx@4.19.2 >/dev/null 2>&1
      - run: npx tsx ${{ inputs.script }}
        env:
          SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_UZUHAMA }}"
          DRY: "${{ inputs.dry && '1' || '0' }}"
