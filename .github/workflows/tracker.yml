name: Daily Data Check

# 하루 한 번 방송 데이터 검증 (Vercel /api/videos/search-index?ai=check · 이미 한 날이면 서버가 바로 건너뜀)
# 알림 점검(tick)은 Cloudflare 워커만 부름. 예전엔 여기서도 5분마다 보조로 불렀는데 Vercel 사용량만 늘어 뺌 (2026-11-23)
on:
  schedule:
    - cron: '41 20 * * *' # 한국 오전 5:41
  workflow_dispatch:

jobs:
  data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check broadcast data
        run: curl -sS --max-time 295 "https://uzuhama.vercel.app/api/videos/search-index?ai=check" | head -c 600 || true
