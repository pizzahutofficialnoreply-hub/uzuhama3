name: Notification Tick

# 방송 시작·유력 시간 자동 알림 점검 (Vercel /api/notifications/tick 호출)
# GitHub 예약 실행은 지연이 커서 보조 수단으로만 사용합니다.
# 주 트리거는 cron-job.org 등 외부 크론(1~5분 간격)과 앱 접속자 핑입니다.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call notification tick
        run: curl -fsS --max-time 60 "https://uzuhama.vercel.app/api/notifications/tick?src=github" || true

  # AI 영상 상세 분석: 한 번에 몇 구간씩 (분석 함수는 최대 300초, 잠금으로 한 번에 하나만)
  ai-video:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Analyze next video segments
        run: curl -sS --max-time 295 "https://uzuhama.vercel.app/api/videos/search-index?ai=run" | head -c 600 || true

  # 방송 기록 데이터 검증 (서버가 하루 한 번만 실제로 함): 방송 시간·게임 이름·게임 링크
  data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check broadcast data
        run: curl -sS --max-time 295 "https://uzuhama.vercel.app/api/videos/search-index?ai=check" | head -c 600 || true
