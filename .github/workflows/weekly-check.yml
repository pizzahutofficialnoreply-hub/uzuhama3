name: 주간 점검

# 정기 점검 시간(관리자 › 시스템 › 점검 › 정기 점검)에 한 번:
#  타입 검사 · 로직 테스트 · 빌드 · 보안 취약점 · e2e · 실제 사이트 화면/개발자 콘솔/UI·UX(휴대폰·PC·밝게·어둡게)
#  · API(Vercel)·DB(Firestore)·보안 · 피드백 총정리·방문자 오류(사이트가 직접) → 관리자 화면 '주간 점검 보고서'
# GitHub 예약은 몇 시간씩 늦을 때가 있어서 토요일 새벽마다 여러 번 깨우고, 이번 회차에 이미 했으면 건너뜀
on:
  schedule:
    - cron: '23 18-23 * * 5'   # 한국 시간 토요일 03:23 ~ 08:23 (매시)
    - cron: '23 0-2 * * 6'     # 한국 시간 토요일 09:23 ~ 11:23 (늦은 경우)
  workflow_dispatch:
    inputs:
      force:
        description: '점검 시간이 아니어도 지금 돌리기'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-check
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: g
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: npx --yes tsx@4.19.2 scripts/weekly/gate.ts

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p weekly-out

      - name: 타입 검사
        id: tsc
        continue-on-error: true
        run: npx tsc --noEmit
      - name: 로직 테스트
        id: vitest
        continue-on-error: true
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=weekly-out/vitest.json
      - name: 빌드
        id: build
        continue-on-error: true
        run: |
          npm run build
          echo "kb=$(du -sk dist/assets | cut -f1)" >> $GITHUB_OUTPUT
      - name: 보안 취약점 (npm audit)
        continue-on-error: true
        run: npm audit --omit=dev --json > weekly-out/audit.json || true

      - run: npx playwright install --with-deps chromium
      - name: e2e (빌드한 사이트를 브라우저로 눌러 보기)
        continue-on-error: true
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 http://localhost:4173 --timeout 60000 || sleep 5
          E2E_JSON=weekly-out/e2e.json node e2e/smoke.mjs
      - name: 실제 사이트 화면·개발자 콘솔·UI/UX
        continue-on-error: true
        run: node scripts/weekly/live-ui.mjs
      - name: API·Vercel·DB·보안
        continue-on-error: true
        run: node scripts/weekly/api-db.mjs

      - name: 보고 (사이트·요약·이슈)
        if: always()
        env:
          TSC_OK: ${{ steps.tsc.outcome }}
          VITEST_OK: ${{ steps.vitest.outcome }}
          BUILD_OK: ${{ steps.build.outcome }}
          BUNDLE_KB: ${{ steps.build.outputs.kb }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/weekly/report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-out
          path: weekly-out
          retention-days: 30
