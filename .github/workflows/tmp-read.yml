name: tmp 읽기 통계 (지움)
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 "https://uzuhama.vercel.app/api/health?readstat=sum&t=$(date +%s)" > s.json
          python3 - <<'PY'
          import json
          for d in json.load(open('s.json')):
              print('== day', d['day'])
              for k in ('server','client'):
                  t=sum(d[k].values()); print(' ', k, 'total', t)
                  for a,b in list(d[k].items())[:14]: print('     ', b, a)
              print('  hours', sorted(d['hours'].items()))
          PY
