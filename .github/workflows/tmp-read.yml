name: tmp 공개 상태 확인 2 (지움)
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://uzuhama.vercel.app
          echo "== dbping"; curl -sS -m 20 "$B/api/health?dbping=1"; echo
          echo "== weekly"; curl -sS -m 20 "$B/api/health?weekly=last"; echo
          curl -sS -m 40 "$B/api/videos/search-index" > idx.json; ls -la idx.json
          python3 - <<'PY'
          import json
          d=json.load(open('idx.json')); e=(d.get('entries') or {}).get('p59s4mXoBrs') or {}
          print('== entry keys', list(e.keys()))
          for k,v in e.items(): print(k, json.dumps(v,ensure_ascii=False)[:2500])
          PY
