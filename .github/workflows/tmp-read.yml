name: tmp 날짜 보정 넣기 (지움)
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: npm i -q firebase-admin@12 >/dev/null 2>&1
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UZUHAMA }}
        run: |
          cat > r.mjs <<'JS'
          import admin from 'firebase-admin';
          admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.SA)) });
          const db = admin.firestore();
          const ref = db.collection('config').doc('system');
          const cur = (await ref.get()).data() || {};
          const list = Array.isArray(cur.dateOverrides) ? cur.dateOverrides : [];
          console.log('before', JSON.stringify(list));
          const add = [{ date: '2026-11-29', type: 'boost', min: 12, note: '10주년 전날' }, { date: '2026-11-30', type: 'boost', min: 40, note: '10주년' }];
          const next = [...list];
          for (const a of add) if (!next.some((o) => o && o.date === a.date)) next.push(a);
          await ref.set({ dateOverrides: next }, { merge: true });
          console.log('after', JSON.stringify(next));
          JS
          node r.mjs
