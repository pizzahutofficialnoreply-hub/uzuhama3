name: tmp 공개 상태 확인 (지움)
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://uzuhama.vercel.app
          echo "== health"; curl -sS -m 20 "$B/api/health" | head -c 600; echo
          echo "== status"; curl -sS -m 20 "$B/api/videos/search-index?status=1" | head -c 2500; echo
          echo "== ids"; curl -sS -m 20 "$B/api/videos/search-index?ai=ids" > ids.json; python3 -c "import json;d=json.load(open('ids.json'));print({k:(len(v) if isinstance(v,(list,dict)) else v) for k,v in d.items()})"
          echo "== comp"; curl -sS -m 25 "$B/api/videos/search-index?ai=video&id=p59s4mXoBrs" > c.json; python3 - <<'PY'
          import json
          d=json.load(open('c.json'))
          print(list(d.keys()))
          v=d.get('video') or d.get('data') or d
          print(json.dumps(v,ensure_ascii=False)[:200])
          for k in ('games','gameStories','chapters','timeline'):
              x=(v or {}).get(k)
              if x: print(k, json.dumps(x,ensure_ascii=False)[:4000])
          PY
