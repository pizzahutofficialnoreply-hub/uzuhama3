name: ai-peek
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 150
          for r in "4500 4620" "600 720"; do set -- $r
            curl -sS --max-time 280 "https://uzuhama.vercel.app/api/videos/search-index?ai=scripttest&id=EWciq134_24&from=$1&to=$2&kind=live" > t.json
            python3 - "$1" "$2" <<'P'
          import json,sys
          a,b=int(sys.argv[1]),int(sys.argv[2])
          d=json.load(open('t.json')); L=d.get('lines') or []
          print('TEST',a,b,'n',len(L),'model',d.get('model'),'err',str(d.get('error',''))[:200], 'squeezed', d.get('squeezed'))
          for l in L: print('L', l['t'], l.get('w',''), l['s'][:70])
          P
          done
