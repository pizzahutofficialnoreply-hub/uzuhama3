name: ai-peek
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 20); do r=$(curl -sS --max-time 200 "https://uzuhama.vercel.app/api/videos/search-index?ai=diag&ping=1"); echo "$r" | grep -q '"sdkVideo"' && break; sleep 15; done
          echo "$r" | python3 -c "import json,sys; d=json.load(sys.stdin)['ping']; [print(k, json.dumps(v, ensure_ascii=False)[:700]) for k,v in d.items()]"
