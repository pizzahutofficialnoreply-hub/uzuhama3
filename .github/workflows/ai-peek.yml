name: ai-peek
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: 공개로 읽을 수 있는 방송 기록(logs_by_month)·몰아보기 받아 두기
        run: |
          node -e '
          const K="AIzaSyD33dUT30Gn5Vr2OKA_X3sI1HAddVsMZoM";const B="https://firestore.googleapis.com/v1/projects/uzuhama/databases/(default)/documents";
          const conv=(v)=>{if(!v)return null;if("stringValue"in v)return v.stringValue;if("integerValue"in v)return Number(v.integerValue);if("doubleValue"in v)return v.doubleValue;if("booleanValue"in v)return v.booleanValue;if("nullValue"in v)return null;if("arrayValue"in v)return (v.arrayValue.values||[]).map(conv);if("mapValue"in v){const o={};for(const[k,x]of Object.entries(v.mapValue.fields||{}))o[k]=conv(x);return o;}if("timestampValue"in v)return v.timestampValue;return null};
          (async()=>{const out={};for(const col of ["logs_by_month","compilations"]){let docs=[],tok="";do{const r=await fetch(`${B}/${col}?pageSize=50&key=${K}${tok?"&pageToken="+tok:""}`);const j=await r.json();if(j.error)throw new Error(JSON.stringify(j.error));docs.push(...(j.documents||[]));tok=j.nextPageToken||"";}while(tok);out[col]=docs.map(d=>({id:d.name.split("/").pop(),...conv({mapValue:{fields:d.fields}})}));console.log(col,docs.length);}require("fs").writeFileSync("dump.json",JSON.stringify(out));})().catch(e=>{console.error(e);process.exit(1)});'
      - name: 몰아보기 영상 설명 받기
        run: |
          node -e '
          const d=JSON.parse(require("fs").readFileSync("dump.json"));
          const ids=[...new Set(d.compilations.map(c=>(String(c.videoUrl||c.url||"").match(/(?:v=|youtu\.be\/|\/live\/|\/shorts\/)([\w-]{11})/)||[])[1]).filter(Boolean))];
          (async()=>{const out={};for(let i=0;i<ids.length;i+=40){const r=await fetch("https://uzuhama.vercel.app/api/videos/meta?desc=1&ids="+ids.slice(i,i+40).join(","));const j=await r.json();Object.assign(out,j.videos||{});}d.meta=out;require("fs").writeFileSync("dump.json",JSON.stringify(d));console.log("meta",Object.keys(out).length,"of",ids.length);})();'
      - name: 로그로 내보내기
        run: echo "DUMPSTART"; gzip -9c dump.json | base64 -w0; echo; echo "DUMPEND"
