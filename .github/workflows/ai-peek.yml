name: ai-peek
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "SM $(curl -sS --max-time 60 'https://uzuhama.vercel.app/api/status-messages' | head -c 200)"
          echo "AI $(curl -sS --max-time 60 'https://uzuhama.vercel.app/api/videos/search-index?ai=status' | python3 -c 'import sys,json;d=json.load(sys.stdin);print({k:v for k,v in d.items() if "cript" in k or k in ("done","doneCount","lastRunAt","model","lastError","partial","calls")})' | head -c 1500)"
          echo "SL $(curl -sS --max-time 90 'https://uzuhama.vercel.app/api/health?sitelogs=1' | python3 -c 'import sys,json,collections;d=json.load(sys.stdin)["logs"];import re;bad=[l["id"] for l in d if not re.match(r"^\d{4}-\d{2}-\d{2}$",str(l.get("date","")))];c=collections.Counter(l["date"] for l in d if not l["isAbsence"]);print(len(d),bad[:5],[x for x in c.items() if x[1]>2][:5])')"
          echo "RS $(curl -sS --max-time 30 'https://uzuhama.vercel.app/api/health?readstat=sum' | python3 -c 'import sys,json;d=json.load(sys.stdin)[0];print(d["day"],d["server"],d["hours"])' | head -c 2500)"
