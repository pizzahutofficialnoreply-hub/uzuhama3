name: ai-peek
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS "https://uzuhama.vercel.app/api/videos/search-index?ai=script&id=EWciq134_24&t=$RANDOM" > s.json
          python3 - <<'P'
          import json
          s=json.load(open('s.json'))
          L=s['lines']; cov=s['covered']
          print('lines',len(L),'segs',len(cov))
          for a,b in cov:
            ts=[l['t']-a for l in L if a<=l['t']<b]
            if not ts: print('SEG',a,b,'empty'); continue
            n=len(ts); ts.sort(); span=b-a
            q=lambda p: ts[min(n-1,int(p*n))]
            print('SEG',a,b,'n',n,'per_min',round(n/(span/60),1),'q25',q(.25),'q50',q(.5),'q90',q(.9),'max',ts[-1], 'last%',round(ts[-1]/span*100))
          P
