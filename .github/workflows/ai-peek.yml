name: ai-peek
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UZUHAMA }}
        run: |
          npm i firebase-admin@12 >/dev/null 2>&1
          cat > r.cjs <<'J'
          const admin = require('firebase-admin');
          admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.SA)) });
          const db = admin.firestore();
          (async () => {
            const s = await db.collection('patch_notes').select('version','title','category','auto','date','createdAt').get();
            const rows = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0, 12);
            console.log('NOTES', JSON.stringify(rows));
            const sys = (await db.collection('config').doc('system').get()).data() || {};
            console.log('AH', JSON.stringify(sys.autoHotfix || null));
            console.log('NL', JSON.stringify((sys.noticeList || []).filter(n => String(n.id||'').startsWith('auto')).map(n => ({ id: n.id, title: n.title, links: n.links }))));
          })();
          J
          echo len ${#SA}; node r.cjs
