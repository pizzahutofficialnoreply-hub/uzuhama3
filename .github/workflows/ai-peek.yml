name: ai-peek
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 20); do r=$(curl -sS --max-time 200 "https://uzuhama.vercel.app/api/videos/search-index?ai=diag&ping=1"); echo "$r" | grep -q '"seg5m"' && break; sleep 15; done
          echo "$r" | grep -oE '"seg[0-9]m":\{"status":[0-9]+,"body":".{0,900}'
          echo "$r" | grep -oE 'promptTokenCount[^,]*' 
