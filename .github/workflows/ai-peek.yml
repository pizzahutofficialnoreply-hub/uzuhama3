name: ai-peek
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; for id in EWciq134_24 pYL8QtKSKXo; do
            curl -sS --max-time 60 "https://uzuhama.vercel.app/api/videos/search-index?ai=video&id=$id&t=$RANDOM" > out/v_$id.json
            curl -sS --max-time 60 "https://uzuhama.vercel.app/api/videos/search-index?ai=script&id=$id&t=$RANDOM" > out/s_$id.json
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: out, path: out }
