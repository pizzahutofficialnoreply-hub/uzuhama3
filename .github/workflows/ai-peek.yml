name: ai-peek
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://firestore.googleapis.com/v1/projects/uzuhama/databases/(default)/documents/config/system?mask.fieldPaths=serviceMode" | head -c 300; echo
          curl -s "https://firestore.googleapis.com/v1/projects/uzuhama/databases/(default)/documents/logs_by_month?pageSize=2&mask.fieldPaths=month" | head -c 300; echo
          curl -s "https://uzuhama.vercel.app/api/health?dbping=1&x=2"; echo
