name: ai-peek
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          st=$(curl -sS --max-time 120 "https://uzuhama.vercel.app/api/videos/search-index?ai=status")
          echo "$st" | python3 -c "import sys,json; j=json.load(sys.stdin); print({k:j.get(k) for k in ['lastRunAt','lastId','model','calls','usedSec','done','partial','coolUntil','lastError','idle']})"
          id=$(echo "$st" | python3 -c "import sys,json; print(json.load(sys.stdin).get('lastId',''))")
          echo "=== script $id"; curl -sS --max-time 60 "https://uzuhama.vercel.app/api/videos/search-index?ai=script&id=$id&nc=$RANDOM" | head -c 1500; echo
