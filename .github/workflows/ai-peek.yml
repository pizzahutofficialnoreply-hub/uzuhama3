name: ai-peek
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 20); do r=$(curl -sS --max-time 120 "https://uzuhama.vercel.app/api/videos/search-index?ai=diag&ping=1"); echo "$r" | grep -q '"live30s"' && break; sleep 15; done
          echo "$r" | head -c 7000; echo
